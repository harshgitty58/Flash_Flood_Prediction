services:
  - type: web
    name: prahar-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PRAHAR_ADMIN_TOKEN      # protects POST /admin/reload; Render generates a random value (see the service's Environment tab)
        generateValue: true
